<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境物流业务系统 - 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'},success:{50:'#f0fdf4',400:'#4ade80',500:'#22c55e',600:'#16a34a'},warning:{50:'#fffbeb',400:'#fbbf24',500:'#f59e0b'},danger:{50:'#fef2f2',400:'#f87171',500:'#ef4444'}}}}}

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;height:100%;-webkit-font-smoothing:antialiased}
.page{display:none;height:100%}
.page.active{display:flex}
.sidebar-item{cursor:pointer;transition:all .15s;position:relative}
.sidebar-item:hover{background:#eef2ff}
.sidebar-item.active{background:#eef2ff;color:#2563eb;font-weight:600}
.sidebar-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:#3b82f6;border-radius:0 3px 3px 0}
.tab-content{display:none}
.tab-content.active{display:block}
.sub-tab{display:none}
.sub-tab.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease-out}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:11px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f3f4f6}
tr:hover td{background:#f9fafb}
.huProgress{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.huProgressFill{height:100%;border-radius:99px;transition:width .5s}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal-body{background:#fff;border-radius:16px;padding:24px;width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.25)}
input,select,textarea{border:1px solid #d1d5db;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.timeline-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px}
.detail-card{background:#fff;border:1px solid #f0f0f0;border-radius:12px;padding:16px;transition:all .15s}
.detail-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06);border-color:#e5e7eb}
.lg-sidebar{width:220px;min-width:220px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column}
@media(max-width:768px){.lg-sidebar{width:56px;min-width:56px}.lg-sidebar span.sidebar-text{display:none}.lg-sidebar .sidebar-item{padding:10px 16px;justify-content:center}}
</style>
</head>
<body class="h-full bg-gray-50">

<!-- ========== LOGIN PAGE ========== -->
<div class="page active" id="page-login">
  <div class="min-h-screen w-full bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl p-8 shadow-2xl fade-in">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-2xl mx-auto mb-3 shadow-lg shadow-blue-200">📦</div>
        <h1 class="text-xl font-bold text-gray-800">跨境物流业务系统</h1>
        <p class="text-sm text-gray-400 mt-1">China-Kazakhstan Logistics Platform</p>
      </div>
      <div class="space-y-4">
        <div><label class="text-sm text-gray-500 mb-1.5 block">邮箱账号</label><input type="email" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="请输入邮箱" value="admin@logistics.com"></div>
        <div>
          <div class="flex items-center justify-between mb-1.5"><label class="text-sm text-gray-500">验证码</label><button class="text-xs text-blue-600 font-medium bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100">获取验证码</button></div>
          <input type="text" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="6位验证码" maxlength="6">
        </div>
        <button class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 rounded-xl font-semibold text-base hover:from-blue-700 hover:to-indigo-700 transition-all mt-2 shadow-lg shadow-blue-200/50" onclick="showPage('main')">登 录</button>
        <p class="text-xs text-center text-gray-400 mt-4">点击登录进入系统 · 演示原型</p>
      </div>
    </div>
  </div>
</div>

<!-- ========== MAIN PAGE ========== -->
<div class="page" id="page-main">
  <!-- Left Sidebar -->
  <div class="lg-sidebar overflow-y-auto">
    <div class="p-4 border-b border-gray-100 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0">K</div>
      <div class="sidebar-text"><div class="font-bold text-sm">跨境物流系统</div><div class="text-[10px] text-gray-400">管理后台 v1.0</div></div>
    </div>
    <div class="flex-1 py-2 space-y-0.5" id="sidebarMenu"></div>
  </div>

  <!-- Right Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Bar -->
    <div class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-5 shrink-0">
      <div class="flex items-center gap-3">
        <h1 class="text-sm font-semibold text-gray-800" id="pageTitle">系统首页</h1>
        <span class="badge bg-blue-50 text-blue-600 text-[10px]">演示环境</span>
      </div>
      <div class="flex items-center gap-3 text-[13px] text-gray-500">
        <span class="hidden sm:inline">2026-05-19 周一</span>
        <span class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white text-[11px] font-medium shadow-sm">管</span>
      </div>
    </div>
    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-5 bg-gray-50" id="contentArea"></div>
  </div>
</div>

<!-- ========== MODAL ========== -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-body fade-in" id="modalContent"></div>

<script>
// ============ MODULES DEFINITION ============
const modules = [
  { id:'dashboard',      label:'系统首页',     icon:'📊', group:'核心视图' },
  { id:'warehouse',      label:'云仓集货管理',   icon:'📦', group:'业务流程' },
  { id:'sorting',        label:'阿拉木图分装',   icon:'📋', group:'业务流程' },
  { id:'documents',      label:'文件生成管理',   icon:'📄', group:'业务流程' },
  { id:'transport',      label:'装车运输管理',   icon:'🚛', group:'业务流程' },
  { id:'customs-cn',     label:'出口报关',      icon:'🏛️', group:'业务流程' },
  { id:'customs-kz',     label:'进口清关',      icon:'🏛️', group:'业务流程' },
  { id:'port-transport', label:'口岸运输管理',   icon:'🚚', group:'业务流程' },
  { id:'warehouse-kz',   label:'仓库分拣管理',   icon:'📦', group:'业务流程' },
  { id:'delivery',       label:'收件点配送',    icon:'🚴', group:'业务流程' },
  { id:'signin',         label:'签收入库管理',   icon:'✍️', group:'业务流程' },
  { id:'reconciliation', label:'对账管理',      icon:'💰', group:'财务管理' },
  { id:'settlement',     label:'资金结算',      icon:'💵', group:'财务管理' },
  { id:'invoice',        label:'支付开票',      icon:'📜', group:'财务管理' },
  { id:'tracking',       label:'物流状态追踪',   icon:'🔍', group:'核心功能' },
  { id:'permissions',    label:'权限管理',      icon:'🔐', group:'核心功能' },
  { id:'stats',          label:'统计分析',      icon:'📈', group:'核心功能' },
  { id:'alerts',         label:'异常预警中心',   icon:'⚠️', group:'核心功能' },
  { id:'billing',        label:'计费规则配置',   icon:'⚙️', group:'核心功能' },

// ============ NAVIGATION ============
function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
}
function navigate(id) {
  document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.remove('active'));
  const item = document.querySelector(`[data-module="${id}"]`);
  if(item) item.classList.add('active');
  const mod = modules.find(m=>m.id===id);
  document.getElementById('pageTitle').textContent = mod ? mod.label : '系统首页';
  const area = document.getElementById('contentArea');
  area.innerHTML = (renderers[id]||renderers.dashboard)() + '<div class="h-8"></div>';
}

function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ============ SIDEBAR ============
function buildSidebar() {
  const menu = document.getElementById('sidebarMenu');
  const groups = {};
  modules.forEach(m => { if(!groups[m.group]) groups[m.group]=[]; groups[m.group].push(m); });
  Object.entries(groups).forEach(([g,items]) => {
    const gDiv = document.createElement('div');
    gDiv.innerHTML = `<div class="px-4 pt-3 pb-1 text-[10px] text-gray-400 font-semibold uppercase tracking-wider sidebar-text">${g}</div>`;
    items.forEach(m => {
      const d = document.createElement('div');
      d.setAttribute('data-module',m.id);
      d.className = 'sidebar-item flex items-center gap-2.5 px-4 py-2 text-sm text-gray-600 ' + (m.id==='dashboard'?'active':'');
      d.innerHTML = `<span class="text-base">${m.icon}</span><span class="sidebar-text">${m.label}</span>`;
      d.onclick = ()=>navigate(m.id);
      gDiv.appendChild(d);
    });
    menu.appendChild(gDiv);
  });
}
